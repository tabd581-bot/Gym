async function weekly(ms,ss){const days=[...Array(7)].map((_,i)=>new Date(Date.now()-i*864e5).toLocaleDateString('en-CA')),ts=(await Promise.all(days.map(dayTot))).filter(t=>t.k>0);
 const av=k=>ts.length?Math.round(ts.reduce((a,t)=>a+t[k],0)/ts.length):0,wk=ss.filter(s=>s.date>=days[6]),w=ms.filter(m=>m.v.w!=null&&m.date>=days[6]).sort((a,b)=>a.date<b.date?-1:1);
 return `<div class="c"><h3>ملخص آخر 7 أيام</h3><div class="row"><span>متوسط السعرات</span><b>${av('k')}</b></div><div class="row"><span>متوسط البروتين</span><b>${av('p')} g</b></div><div class="row"><span>أيام التمرين</span><b>${new Set(wk.map(s=>s.date)).size}</b></div><div class="row"><span>تمارين مكتملة</span><b>${wk.length}</b></div><div class="row"><span>تغير الوزن</span><b>${w.length>1?n1(w[w.length-1].v.w-w[0].v.w)+' kg':'—'}</b></div><div class="row"><span>تحقيق هدف السعرات</span><b>${Math.round(av('k')/S.cal*100)}%</b></div></div>`}
/* ===== Settings, reminders, backup ===== */
async function saveSet(){['name','age','h','w','gender'].forEach(k=>P[k]=['name','gender'].includes(k)?$('#p_'+k).value:num($('#p_'+k).value));['cal','p','c','f','surplus','rest','mult'].forEach(k=>S[k]=num($('#s_'+k).value));await put('profile',P);await put('settings',S);render();alert('تم الحفظ')}
async function applyCal(){const c=Math.round(bmr()*num($('#s_mult').value)+num($('#s_surplus').value));if(confirm('تغيير هدف السعرات إلى '+c+' ؟')){S.cal=c;S.mult=num($('#s_mult').value);S.surplus=num($('#s_surplus').value);await put('settings',S);render()}}
function notify(t,b){if('Notification'in window&&Notification.permission=='granted'&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:'icon.svg',tag:t})).catch(()=>{})}
function fire(k){const msg=R.msg[k]||'حان موعد '+MN[k];notify('GYM TRACKER PRO',msg);const b=$('#ban');b.style.display='block';b.innerHTML=`${E(msg)}<div class="r"><button onclick="snooze('${k}')" style="background:#101215;color:#b8f03c">تأجيل 10د</button><button onclick="markDone('${k}',true);$('#ban').style.display='none'">تم</button><button class="s" onclick="$('#ban').style.display='none'">إغلاق</button></div>`}
const snooze=k=>{$('#ban').style.display='none';setTimeout(()=>fire(k),6e5)};
async function remCheck(){const hm=new Date().toTimeString().slice(0,5);for(const k of Object.keys(MN))if(R.on[k]&&R.t[k]==hm&&R.fired!=td()+k){R.fired=td()+k;await put('reminders',R);const m=await get('meals',td());if(!(m&&m.done[k]))fire(k)}}
async function askNotif(){if(!('Notification'in window))return alert('المتصفح لا يدعم الإشعارات');const p=await Notification.requestPermission();if(p=='granted')notify('GYM TRACKER PRO','الإشعارات تعمل');else alert('تم رفض الإذن')}
async function exportJSON(){const d={app:'GTP',v:1,at:new Date().toISOString(),stores:{}};for(const s of ST)d.stores[s]=await all(s);dl('gym-backup-'+td()+'.json',JSON.stringify(d),'application/json')}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:m}));a.download=n;a.click()}
async function importJSON(f){if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!='GTP'||typeof d.stores!='object')throw 0;for(const s of ST)if(d.stores[s]&&!Array.isArray(d.stores[s]))throw 0;
 if(!confirm('سيتم استبدال كل البيانات الحالية بالنسخة. متابعة؟'))return;for(const s of ST)if(Array.isArray(d.stores[s])){await clr(s);for(const o of d.stores[s])if(o&&o.id!=null)await put(s,o)}location.reload()}catch(e){alert('ملف غير صالح')}}
async function exportCSV(s){const q=c=>'"'+String(c??'').replace(/"/g,'""')+'"';let rows;
 if(s=='sessions')rows=[['date','workout','exercise','set','kg','reps','done','minutes','note'],...(await all(s)).filter(x=>!x.active).flatMap(x=>x.ex.flatMap(e=>e.sets.map((t,i)=>[x.date,x.name,e.name,i+1,t.w,t.r,t.d,Math.round(x.dur/6e4),e.note])))];
 else if(s=='meals')rows=[['date','meal','food','grams','kcal','protein','carbs','fat'],...(await all(s)).flatMap(m=>Object.entries(m.items).flatMap(([k,a])=>a.map(i=>[m.id,MN[k],i.name,i.g,n1(i.k),n1(i.p),n1(i.c),n1(i.f)])))];
 else rows=[['date',...Object.keys(MK)],...(await all(s)).map(m=>[m.date,...Object.keys(MK).map(k=>m.v[k]??'')])];
 dl(s+'-'+td()+'.csv',rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv')}
async function resetApp(){if(!confirm('سيتم حذف كل البيانات نهائياً. متأكد؟'))return;if(!confirm('تأكيد أخير: لا يمكن التراجع.'))return;db.close();indexedDB.deleteDatabase('gtp').onsuccess=()=>location.reload()}
init();
</script></body></html>
